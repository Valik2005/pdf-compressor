name: Experimental Windows onedir bundle audit

# Only a review-branch experiment. Does not publish or upload binaries.
on:
  push:
    branches:
      - release/2.7-bundle-audit
  workflow_dispatch:

jobs:
  build-and-audit:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install exact reviewed dependency versions
        run: |
          python -m pip install "PyMuPDF==1.27.2.3" "PySide6==6.12.0" "Pillow==12.3.0" "pyinstaller==6.22.3"
      - name: Build experimental separate-DLL EXE
        run: python -m PyInstaller --noconfirm --clean release_windows_onedir_review.spec
      - name: Verify external Qt DLL layout and absence of Virtual Keyboard
        run: python tools/verify_onedir_bundle.py --bundle-dir .\dist\PDF_Compressor_2_7_onedir_review --out .\dist\onedir-audit.json
      - name: Upload audit JSON only (no binary redistribution)
        uses: actions/upload-artifact@v4
        with:
          name: onedir-layout-audit
          path: dist/onedir-audit.json
          if-no-files-found: error
