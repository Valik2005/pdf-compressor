name: Verify v2.8 final EXE metadata (NOT FOR RELEASE)

# Verify PyInstaller spec and PE VERSIONINFO without a signing token or
# publishing a candidate. App may still be 2.8-preview on this PR.
on:
  push:
    branches: [chore/2.8-signpath-release-prep]
    paths:
      - release_windows_2_8.spec
      - tools/windows_version_info_2_8.txt
      - .github/workflows/review-28-metadata.yml
      - .github/workflows/sign-v2_8.yml
  pull_request:
    branches: [develop/2.8-quality-audit]
    paths:
      - release_windows_2_8.spec
      - tools/windows_version_info_2_8.txt
      - .github/workflows/review-28-metadata.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-metadata:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install exact reviewed Windows packages
        run: python -m pip install "PyMuPDF==1.27.2.3" "PySide6==6.12.0" "Pillow==12.3.0" "pyinstaller==6.22.3"
      - name: Build preview-only metadata test, not public binary
        run: python -m PyInstaller --clean --noconfirm release_windows_2_8.spec
      - name: Check metadata, launch headlessly and never publish
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/PDF_Compressor_2_8.exe').Path
          $v = (Get-Item -LiteralPath $exe).VersionInfo
          if ($v.ProductName -ne 'PDF Compressor' -or $v.FileVersion -ne '2.8.0.0' -or
              $v.ProductVersion -ne '2.8.0.0' -or $v.OriginalFilename -ne 'PDF_Compressor_2_8.exe') {
            throw "Unexpected product metadata: $($v.ProductName), $($v.FileVersion), $($v.ProductVersion), $($v.OriginalFilename)"
          }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $p = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 10
            $p.Refresh()
            if ($p.HasExited) { throw "EXE exited early: $($p.ExitCode)" }
          } finally {
            $p.Refresh()
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }
          Write-Host "Windows PE metadata and GUI smoke passed. EXE intentionally NOT uploaded."
      - name: Check compiled onefile dependencies
        run: |
          python tools/audit_pyinstaller_bundle.py --exe dist/PDF_Compressor_2_8.exe --reject-virtual-keyboard --out dist/review-bundle-audit.json
          python tools/audit_onefile_native_sources.py --audit dist/review-bundle-audit.json --out dist/review-native-sources.json
      - uses: actions/upload-artifact@v4
        with:
          name: v2-8-pe-metadata-and-native-audit-NOT-FOR-RELEASE
          path: |
            dist/review-bundle-audit.json
            dist/review-native-sources.json
          if-no-files-found: error
          retention-days: 7
