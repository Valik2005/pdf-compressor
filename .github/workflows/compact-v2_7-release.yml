name: One-time simplify PDF Compressor 2.7 Release assets

# Safe one-time cleanup. Never replace the EXE or modify the v2.7.0 tag.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compact-v2_7-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compact-pdf-compressor-2-7-assets
  cancel-in-progress: false

jobs:
  simplify-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v2.7.0
      ARCHIVE: Third_Party_Sources_and_Licenses.zip
    steps:
      - uses: actions/checkout@v4

      - name: Obtain authoritative asset metadata and original release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-current
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > original-release.json
          gh release download "$RELEASE_TAG" --dir release-current --clobber

      - name: Verify all 18 originals and repack sources, licenses and audits
        shell: bash
        run: |
          set -euo pipefail
          python tools/package_compact_release_assets.py \
            --assets release-current \
            --catalog docs/source-archives-2_7.json \
            --release-json original-release.json
          cp release-current/SHA256SUMS_COMPACT.txt SHA256SUMS.txt
          sha256sum release-current/"$ARCHIVE" SHA256SUMS.txt

      - name: Upload and independently verify the complete combined archive
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "release-current/$ARCHIVE"
          expected="$(sha256sum "release-current/$ARCHIVE" | cut -d ' ' -f 1)"
          actual="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq ".assets[] | select(.name == \"$ARCHIVE\") | .digest")"
          if [[ "$actual" != "sha256:$expected" ]]; then
            echo "Uploaded ZIP SHA-256 mismatch: expected sha256:$expected, got $actual" >&2
            exit 1
          fi
          echo "New sources-and-licenses bundle independently verified."

      - name: Replace checksums and verify unchanged EXE plus new ZIP
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt --clobber
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > after-upload.json
          python - <<'PY'
          import hashlib,json,pathlib
          rel=json.loads(pathlib.Path('after-upload.json').read_text())
          report=json.loads(pathlib.Path('release-current/release-compaction-report.json').read_text())
          assets={a['name']:a for a in rel['assets']}
          for name, wanted in [
              ('PDF_Compressor_2_7.exe',report['exe_sha256']),
              ('Third_Party_Sources_and_Licenses.zip',report['bundle_sha256']),
              ('SHA256SUMS.txt',hashlib.sha256(pathlib.Path('SHA256SUMS.txt').read_bytes()).hexdigest()),
          ]:
              assert assets[name]['digest']=='sha256:'+wanted, (name,'mismatch')
          actual=pathlib.Path('SHA256SUMS.txt').read_text(encoding='utf-8').splitlines()
          assert len(actual)==2 and all('  ' in line for line in actual)
          assert any(report['exe_sha256'] in line for line in actual)
          assert any(report['bundle_sha256'] in line for line in actual)
          assert rel['tag_name']=='v2.7.0' and not rel['draft']
          print('EXE and source ZIP and checksums match GitHub SHA-256.')
          PY

      - name: Remove only old assets that were preserved inside checked archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > obsolete-assets.txt
          import json
          r=json.load(open('release-current/release-compaction-report.json',encoding='utf-8'))
          assert r['original_asset_count']==18 and r['new_asset_count']==3
          old=r['remove_after_upload_and_verified']
          assert len(old)==16 and 'PDF_Compressor_2_7.exe' not in old and 'SHA256SUMS.txt' not in old
          print('\n'.join(old))
          PY
          while IFS= read -r name; do
            [[ -n "$name" ]] || continue
            gh release delete-asset "$RELEASE_TAG" "$name" --yes
            echo "Consolidated old asset: $name"
          done < obsolete-assets.txt

      - name: Update release notes for three-file download layout
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --notes-file docs/RELEASE_NOTES_2_7_COMPACT.md

      - name: Independently confirm exact public stable release inventory
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > final-release.json
          python - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path('final-release.json').read_text())
          report=json.loads(pathlib.Path('release-current/release-compaction-report.json').read_text())
          assets={x['name']:x for x in r['assets']}
          expected={'PDF_Compressor_2_7.exe','Third_Party_Sources_and_Licenses.zip','SHA256SUMS.txt'}
          assert set(assets)==expected, set(assets)
          assert assets['PDF_Compressor_2_7.exe']['digest']=='sha256:'+report['exe_sha256']
          assert assets['Third_Party_Sources_and_Licenses.zip']['digest']=='sha256:'+report['bundle_sha256']
          assert r['tag_name']=='v2.7.0' and not r['draft'] and not r['prerelease']
          assert r['target_commitish']=='5b2d780d699b77d96dd99400364bab1725a4c7ea'
          assert 'Third_Party_Sources_and_Licenses.zip' in r['body']
          print('SUCCESS: three release assets; original EXE and v2.7.0 tag unchanged')
          print(r['html_url'])
          PY
