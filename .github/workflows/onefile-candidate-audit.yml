name: Windows onefile release candidate audit

# Candidate-only. Never publishes a GitHub Release or distributes an EXE.
on:
  pull_request:
    branches:
      - develop/2.7-smartfit
    paths:
      - "release_windows_review.spec"
      - ".github/workflows/onefile-candidate-audit.yml"
      - "tools/collect_license_evidence.py"
      - "tools/audit_pyinstaller_bundle.py"
      - "tools/release_manifest.py"
      - "app.pyw"
      - "pdf_engine.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit-onefile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install pinned reviewed dependencies
        run: python -m pip install "PyMuPDF==1.27.2.3" "PySide6==6.12.0" "Pillow==12.3.0" "pyinstaller==6.22.3"
      - name: Build actual onefile candidate
        run: python -m PyInstaller --noconfirm --clean release_windows_review.spec
      - name: Generate exact candidate manifest
        run: python tools/release_manifest.py --exe .\\dist\\PDF_Compressor_2_7_license_review.exe --out .\\dist\\onefile-manifest.json
      - name: Inspect PyInstaller archive and reject Virtual Keyboard
        run: python tools/audit_pyinstaller_bundle.py --exe .\\dist\\PDF_Compressor_2_7_license_review.exe --reject-virtual-keyboard --out .\\dist\\onefile-bundle-audit.json
      - name: Assert unused Qt PDF, QML and Quick binaries excluded
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          audit = json.loads(Path("dist/onefile-bundle-audit.json").read_text(encoding="utf-8"))
          dlls = [v.replace(chr(92), "/").lower() for v in audit["qt_dlls"]]
          blocked = [v for v in dlls if v.endswith("/qt6pdf.dll") or "/qt6qml" in v or "/qt6quick" in v]
          files = [e["name"].replace(chr(92), "/").lower() for e in audit["all_entries"]]
          blocked += [v for v in files if v.endswith("/qpdf.dll") or v.endswith("/qpdfium.dll")]
          if blocked: raise AssertionError(f"Unexpected optional Qt module files: {blocked}")
          print("Unused Qt PDF, QML, Quick DLL/plugin files excluded")
          '@ | python -
      - name: Validate manifest matches executable
        shell: pwsh
        run: |
          @'
          import hashlib, json
          from pathlib import Path
          exe = Path("dist/PDF_Compressor_2_7_license_review.exe")
          manifest = json.loads(Path("dist/onefile-manifest.json").read_text(encoding="utf-8"))
          digest = hashlib.sha256(exe.read_bytes()).hexdigest()
          assert manifest["exe_sha256"].lower() == digest
          assert manifest["exe_size_bytes"] == exe.stat().st_size
          print("Verified candidate EXE:", exe.stat().st_size, digest)
          '@ | python -
      - name: GUI startup smoke (no PDF re-tests)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $exe = (Resolve-Path ".\\dist\\PDF_Compressor_2_7_license_review.exe").Path
          $p = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 12
            $p.Refresh()
            if ($p.HasExited) { throw "Onefile candidate exited early: $($p.ExitCode)" }
            Write-Output "Onefile GUI startup succeeded"
          } finally {
            $p.Refresh()
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }
      - name: Collect exact-build license evidence (incomplete by design)
        run: python tools/collect_license_evidence.py --exe .\\dist\\PDF_Compressor_2_7_license_review.exe --manifest .\\dist\\onefile-manifest.json --out .\\dist\\license-evidence-not-for-release.zip
      - name: Upload audit JSON only, NOT EXE
        uses: actions/upload-artifact@v4
        with:
          name: onefile-candidate-audit
          path: |
            dist/onefile-manifest.json
            dist/onefile-bundle-audit.json
            dist/license-evidence-not-for-release.zip
          if-no-files-found: error
      - name: Upload private review EXE (not a published release)
        uses: actions/upload-artifact@v4
        with:
          name: onefile-candidate-exe-NOT-FOR-RELEASE
          path: dist/PDF_Compressor_2_7_license_review.exe
          if-no-files-found: error
          retention-days: 7
