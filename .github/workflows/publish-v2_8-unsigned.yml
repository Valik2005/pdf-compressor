name: Publish verified UNSIGNED PDF Compressor v2.8 (automated, owner license approval required)

# Automatic only AFTER full exact-main CI acceptance and a separate, explicit
# v2.8 third-party license attestation posted by the owner to merged PR #17.
# A comment can re-trigger the same checked release without Run workflow.
# Manual dispatch remains as the emergency owner-only route. Never publish
# from a PR head, stale commit, failed CI, or unsigned unverified source ZIP.
on:
  workflow_run:
    workflows: ["Final 2.8 unsigned acceptance candidate (NOT FOR RELEASE)"]
    types: [completed]
    branches: [main]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      acceptance_run_id:
        description: 'Successful Final 2.8 unsigned acceptance run ID from EXACT main commit'
        type: string
        required: true
      release_confirmation:
        description: 'Type RELEASE_V2_8_UNSIGNED to confirm publication of an UNTRUSTED EXE'
        type: string
        required: true
      license_confirmation:
        description: 'Type LICENSE_OBLIGATIONS_REVIEWED after independent third-party license review'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: publish-v2-8-once
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'workflow_dispatch' && github.actor == 'Valik2005') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main') ||
        (github.event_name == 'issue_comment' &&
         github.actor == 'Valik2005' &&
         github.event.issue.number == 17 &&
         github.event.issue.pull_request != null)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      issues: read
    outputs:
      authorized: ${{ steps.owner-gate.outputs.authorized }}
      acceptance_run_id: ${{ steps.owner-gate.outputs.acceptance_run_id }}
    steps:
      - name: Check owner license attestation and successful exact-commit CI
        id: owner-gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          OWNER_LOGIN: Valik2005
          RUN_ID_MANUAL: ${{ inputs.acceptance_run_id }}
          RELEASE_MANUAL: ${{ inputs.release_confirmation }}
          LICENSE_MANUAL: ${{ inputs.license_confirmation }}
        run: |
          set -euo pipefail
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > main-branch.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" > source-runs.json
          gh api "repos/$GITHUB_REPOSITORY/issues/17/comments?per_page=100" > license-comments.json
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > existing-releases.json
          python - <<'PY'
          import json, os, pathlib, re, sys
          read=lambda path: json.loads(pathlib.Path(path).read_text(encoding='utf-8'))
          main=read('main-branch.json')
          runs=read('source-runs.json')['workflow_runs']
          comments=read('license-comments.json')
          releases=read('existing-releases.json')
          event=read(os.environ['GITHUB_EVENT_PATH'])
          sha=os.environ['GITHUB_SHA']
          kind=os.environ['EVENT_NAME']
          owner=os.environ['OWNER_LOGIN']
          assert re.fullmatch('[0-9a-f]{40}', sha), 'Invalid source SHA'
          assert main['commit']['sha']==sha, 'main moved; refuse stale automatic release'
          if any(x['tag_name']=='v2.8' for x in releases):
              print('v2.8 release already exists; no new release')
              sys.exit(0)
          if kind=='workflow_dispatch':
              assert os.environ['GITHUB_ACTOR']==owner, 'Only owner may manually authorize'
              assert os.environ['RELEASE_MANUAL']=='RELEASE_V2_8_UNSIGNED'
              assert os.environ['LICENSE_MANUAL']=='LICENSE_OBLIGATIONS_REVIEWED'
              manual_id=os.environ['RUN_ID_MANUAL']
              assert re.fullmatch('[0-9]{7,15}', manual_id), 'Invalid acceptance run ID'
          else:
              # No AI-authored summary or approval of publication substitutes for
              # this exact independent third-party license attestation by owner.
              attestation=f'LICENSE_OBLIGATIONS_REVIEWED v2.8 {sha}'
              approved=any(
                  c.get('user',{}).get('login')==owner and
                  c.get('author_association')=='OWNER' and
                  c.get('body','').strip()==attestation
                  for c in comments
              )
              if kind=='issue_comment':
                  assert event['issue']['number']==17
                  assert 'pull_request' in event['issue']
                  assert event['comment']['user']['login']==owner
                  assert event['comment']['body'].strip()==attestation, 'Not a release license attestation'
              elif kind=='workflow_run':
                  assert event['workflow_run']['head_branch']=='main'
                  assert event['workflow_run']['conclusion']=='success'
                  assert event['workflow_run']['head_sha']==sha
              else:
                  raise AssertionError('Unexpected event')
              if not approved:
                  print('No independent owner license attestation for exact main SHA; keeping v2.8 private.')
                  sys.exit(0)
              manual_id=None
          matching=[
              x for x in runs
              if x.get('name')=='Final 2.8 unsigned acceptance candidate (NOT FOR RELEASE)'
              and x.get('head_sha')==sha and x.get('head_branch')=='main'
              and x.get('status')=='completed' and x.get('conclusion')=='success'
              and x.get('event') in ('push','workflow_dispatch')
              and x.get('actor',{}).get('login')==owner
          ]
          if kind=='workflow_run':
              matching=[x for x in matching if x['id']==event['workflow_run']['id']]
          if kind=='workflow_dispatch':
              matching=[x for x in matching if str(x['id'])==manual_id]
          assert matching, 'No completed successful full acceptance CI for this exact main SHA'
          acceptance=max(matching,key=lambda x:x['id'])
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f"authorized=true\nacceptance_run_id={acceptance['id']}\n")
          print('Authorized source CI:',acceptance['html_url'],'sha:',sha)
          PY

  publish-unsigned-28:
    needs: [authorize]
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Enforce exact reviewed commit and accepted 62-native build
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_RUN_ID: ${{ needs.authorize.outputs.acceptance_run_id }}
          EXPECTED_COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPOSITORY/branches/main" --jq '.commit.sha')" = "$EXPECTED_COMMIT" || { echo 'main changed, refuse stale release'; exit 1; }
          [[ "$ACCEPTANCE_RUN_ID" =~ ^[0-9]{7,15}$ ]] || { echo 'Invalid Actions run ID' >&2; exit 1; }
          python - <<'PY'
          from pathlib import Path
          app = Path('app.pyw').read_text(encoding='utf-8')
          assert 'APP_VERSION = "2.8"' in app
          assert 'from test_report import' not in app
          assert not Path('test_report.py').exists()
          assert Path('docs/RELEASE_NOTES_2_8_UNSIGNED.md').exists()
          PY
          gh api "repos/$REPOSITORY/actions/runs/$ACCEPTANCE_RUN_ID" > accepted-run.json
          python - <<'PY'
          import json, os
          run = json.load(open('accepted-run.json', encoding='utf-8'))
          assert run['name'] == 'Final 2.8 unsigned acceptance candidate (NOT FOR RELEASE)'
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['head_branch'] == 'main' and run['head_sha'] == os.environ['EXPECTED_COMMIT']
          assert run['event'] in ('push', 'workflow_dispatch')
          assert run['actor']['login'] == 'Valik2005'
          print('Verified one-commit acceptance:', run['html_url'])
          PY
          if gh api "repos/$REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == "v2.8") | .id' | grep -q '[0-9]'; then
            echo 'v2.8 draft/published release already exists: refusing to overwrite' >&2; exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v2.8 >/dev/null 2>&1; then
            echo 'v2.8 tag already exists: refusing to overwrite' >&2; exit 1
          fi

      - name: Download exactly the independently checked 3-file unsigned artifact
        uses: actions/download-artifact@v4
        with:
          name: v2-8-UNSIGNED-three-file-candidate-NOT-PUBLISHED
          github-token: ${{ github.token }}
          run-id: ${{ needs.authorize.outputs.acceptance_run_id }}
          path: release-assets

      - name: Verify unsigned Windows proof, sources, and all three hashes
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 3
          ( cd release-assets && sha256sum --check SHA256SUMS.txt --status )
          python - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          base = Path('release-assets')
          exe = base/'PDF_Compressor_2_8.exe'
          sourcezip = base/'Third_Party_Sources_and_Licenses.zip'
          sums = base/'SHA256SUMS.txt'
          assert {p.name for p in base.iterdir()} == {exe.name, sourcezip.name, sums.name}
          assert exe.stat().st_size > 1000000 and sourcezip.stat().st_size > 100000
          sha = hashlib.sha256(exe.read_bytes()).hexdigest()
          with zipfile.ZipFile(sourcezip) as z:
            assert z.testzip() is None
            entries = set(z.namelist())
            assert len([n for n in entries if n.startswith('sources/')]) == 9
            needed = {
                'README.txt', 'SOURCES_SHA256SUMS.txt',
                'licenses/LGPL_RELINKING_2_8.md',
                'licenses/THIRD_PARTY_NOTICES_2_8.zip',
                'licenses/license-evidence.zip',
                'reports/source-archive-audit.json',
                'reports/source-download-report.json',
                'reports/build-manifest.json',
                'reports/bundle-audit.json',
                'reports/native-source-mapping.json',
                'reports/native-binary-origin.json',
                'reports/native-collection-sources.json',
                'reports/presign-technical-evidence.json',
                'reports/unsigned-authenticode-check.json'
            }
            assert needed.issubset(entries), sorted(needed - entries)
            assert b'NO trusted' in z.read('README.txt')
            assert 'signature-verification.json' not in entries
            manifest = json.loads(z.read('reports/build-manifest.json'))
            unsigned = json.loads(z.read('reports/unsigned-authenticode-check.json'))
            sources = json.loads(z.read('reports/source-archive-audit.json'))
            downloads = json.loads(z.read('reports/source-download-report.json'))
            evidence = json.loads(z.read('reports/presign-technical-evidence.json'))
            assert manifest['source_git_commit'] == os.environ['EXPECTED_COMMIT']
            assert manifest['source_has_local_changes'] is False
            assert manifest['exe_sha256'] == sha
            assert unsigned['status'] == 'NotSigned' and unsigned['checked_on_windows'] is True
            assert unsigned['source_git_commit'] == os.environ['EXPECTED_COMMIT']
            assert unsigned['exe_sha256'] == sha
            origin = json.loads(z.read('reports/native-binary-origin.json'))
            assert origin['source_git_commit'] == os.environ['EXPECTED_COMMIT']
            assert origin['exe_sha256'] == sha
            # The 62-native experiment is deliberately Microsoft-free. If a
            # maintainer promotes it into main after Windows-client validation,
            # the public publisher must still refuse any embedded MSVC/UCRT.
            assert origin['native_file_count'] == 62
            assert len(origin['entries']) == 62
            forbidden_ms = {'vcruntime140.dll', 'vcruntime140_1.dll',
                            'msvcp140.dll', 'msvcp140_1.dll',
                            'msvcp140_2.dll', 'ucrtbase.dll'}
            for record in origin['entries']:
                basename = record['name'].replace(chr(92), '/').rsplit('/', 1)[-1].lower()
                assert basename not in forbidden_ms, basename
                assert not (basename.startswith('api-ms-win-') and basename.endswith('.dll')), basename
            assert origin['redistribution_rights_verified'] is False
            assert not origin['unmatched_wheel_entries']
            assert not origin['installed_wheel_record_mismatches']
            assert evidence['native_byte_identical_origin_count'] == origin['matched_count']
            collected = json.loads(z.read('reports/native-collection-sources.json'))
            assert collected['source_git_commit'] == os.environ['EXPECTED_COMMIT']
            assert collected['native_file_count'] == origin['native_file_count']
            assert collected['redistribution_rights_verified'] is False
            assert evidence['native_build_sources_match_exe'] is True
            assert evidence['native_build_source_scope_counts'] == collected['source_scope_counts']
            assert evidence['technical_integrity_checks_passed'] is True
            assert evidence['license_compliance_certified'] is False
            assert evidence['source_git_commit'] == os.environ['EXPECTED_COMMIT']
            assert evidence['unsigned_exe_sha256'] == sha
            assert evidence['source_archives_verified'] == 9
            assert sources['all_required_with_published_hashes'] is True
            assert downloads['all_required_archives_verified'] is True
          print('All three UNTRUSTED release assets verified from the exact main commit.')
          PY

      - name: Stage unsigned v2.8 as a DRAFT with only three assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v2.8 release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PDF Compressor 2.8 — unsigned" \
            --notes-file docs/RELEASE_NOTES_2_8_UNSIGNED.md --draft

      - name: Verify uploaded asset hashes before making release public
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > all-releases.json
          python - <<'PY'
          import json
          entries=json.load(open('all-releases.json',encoding='utf-8'))
          selected=[x for x in entries if x.get('tag_name')=='v2.8']
          assert len(selected)==1 and selected[0]['draft'] is True
          with open('uploaded.json','w',encoding='utf-8') as out:
              json.dump(selected[0],out)
          PY
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          release = json.load(open('uploaded.json', encoding='utf-8'))
          assert release['draft'] is True and release['prerelease'] is False
          names = {'PDF_Compressor_2_8.exe', 'Third_Party_Sources_and_Licenses.zip', 'SHA256SUMS.txt'}
          assets = {a['name']:a for a in release['assets']}
          assert set(assets) == names
          for name in names:
              sha = hashlib.sha256((Path('release-assets') / name).read_bytes()).hexdigest()
              assert assets[name]['digest'] == 'sha256:' + sha
          print('GitHub asset SHA-256 hashes agree with source artifacts.')
          PY

      - name: Publish verified UNSIGNED v2.8 only after all owner gates passed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" = "$GITHUB_SHA" || { echo 'main changed since audit; keeping draft'; exit 1; }
          RELEASE_ID="$(python -c "import json; r=json.load(open('uploaded.json',encoding='utf-8')); print(r['id'])")"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -F make_latest=true > published.json
          python - <<'PY'
          import json,os
          r=json.load(open('published.json',encoding='utf-8'))
          assert r['draft'] is False and not r['prerelease']
          assert r['tag_name']=='v2.8' and len(r['assets'])==3
          assert r['target_commitish']==os.environ['GITHUB_SHA']
          print('Published:',r['html_url'])
          PY
