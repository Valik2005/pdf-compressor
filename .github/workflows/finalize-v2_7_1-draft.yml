name: Finalize verified PDF Compressor 2.7.1 draft release

# One-time recovery for GitHub's draft release API tag lookup.
# No rebuilds, no replacement assets, no release/tag overwrite.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-v2_7_1-draft.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-verified-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_RELEASE_ID: '438507120'
      EXPECTED_COMMIT: bea3aa016f4ccdf5d94cae48e3ddda7864c4b863
    steps:
      - uses: actions/checkout@v4
      - name: Verify all three draft assets match the final Windows build and sources
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$EXPECTED_RELEASE_ID" > draft-release.json
          python - <<'PY'
          import json,os
          r=json.load(open('draft-release.json',encoding='utf-8'))
          assert str(r['id'])==os.environ['EXPECTED_RELEASE_ID']
          assert r['tag_name']=='v2.7.1' and r['draft'] and not r['prerelease']
          assert r['target_commitish']==os.environ['EXPECTED_COMMIT']
          expected={
            'PDF_Compressor_2_7_1.exe': (
                69992183, 'sha256:df8f537293ef724f567150387242c82411d2b7e1cdaf626eb5e01723f95ec157'),
            'Third_Party_Sources_and_Licenses.zip': (
                226782711, 'sha256:36a6eaad7134f2b6631428cda67d02a5d5f18401a9eeeaeb745fce0de99a06f0'),
            'SHA256SUMS.txt': (
                194, 'sha256:760105ebae281470a56a58e7a496918e114bfa1ed20ee315f2b779bd28faeb68'),
          }
          assets={a['name']:a for a in r['assets']}
          assert set(assets)==set(expected),sorted(assets)
          for name,(size,sha256) in expected.items():
              assert assets[name]['size']==size and assets[name]['digest']==sha256,name
              assert assets[name]['state']=='uploaded',name
          print('Verified stable v2.7.1 draft: exact source commit and all three assets.')
          PY

      - name: Publish previously validated draft as latest stable release
        shell: bash
        run: |
          set -euo pipefail
          gh release edit v2.7.1 --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Verify public release tag, commit and exact unchanged assets
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v2.7.1" > published-release.json
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v2.7.1" > published-tag.json
          python - <<'PY'
          import json,os
          r=json.load(open('published-release.json',encoding='utf-8'))
          tag=json.load(open('published-tag.json',encoding='utf-8'))
          assert not r['draft'] and not r['prerelease'] and r['tag_name']=='v2.7.1'
          assert r['target_commitish']==os.environ['EXPECTED_COMMIT']
          assert tag['object']['sha']==os.environ['EXPECTED_COMMIT']
          assets={a['name']:a for a in r['assets']}
          assert set(assets)=={'PDF_Compressor_2_7_1.exe',
                               'Third_Party_Sources_and_Licenses.zip','SHA256SUMS.txt'}
          assert assets['PDF_Compressor_2_7_1.exe']['digest']=='sha256:df8f537293ef724f567150387242c82411d2b7e1cdaf626eb5e01723f95ec157'
          assert assets['Third_Party_Sources_and_Licenses.zip']['digest']=='sha256:36a6eaad7134f2b6631428cda67d02a5d5f18401a9eeeaeb745fce0de99a06f0'
          print('SUCCESS: PDF Compressor 2.7.1 publicly released with three files')
          print(r['html_url'])
          PY
