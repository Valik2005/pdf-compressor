name: PDF Compressor 2.7 final release gate

# Dry-run both assets on PRs; only a successful push to main may publish.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release-v2_7.yml"
      - "tools/**"
      - "docs/**"
      - "release_windows_review.spec"
      - "app.pyw"
      - "pdf_engine.py"
      - "requirements*.txt"
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v2_7.yml"
      - "release_windows_review.spec"
      - "app.pyw"
      - "pdf_engine.py"
  workflow_dispatch:

concurrency:
  group: pdf-compressor-release-2-7
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Verify exact committed version and run functional source tests
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

  sources-and-notices:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Download and verify all six mandatory sources
        run: python tools/fetch_required_sources.py --out-dir dist/source-candidates --require-all
      - name: Independently verify archive hashes against committed catalog
        run: python tools/verify_source_archives.py --catalog docs/source-archives-2_7.json --source-dir dist/source-candidates --out dist/source-archive-audit.json --require-all-verified
      - name: Assemble third-party notices from verified upstream sources
        run: python tools/package_release_notices.py --sources dist/source-candidates --out dist/release-notices-review.zip
      - name: Validate source asset names and notice contents
        run: |
          python - <<'PY'
          import json, pathlib, zipfile
          cat=json.loads(pathlib.Path('docs/source-archives-2_7.json').read_text())
          required=[x for x in cat['entries'] if x['required']]
          assert len(required)==6
          for item in required:
              p=pathlib.Path('dist/source-candidates')/item['filename']
              assert p.is_file() and p.stat().st_size>10000, p
          with zipfile.ZipFile('dist/release-notices-review.zip') as z:
              names=z.namelist()
              assert len(names)>=65
              for prefix in ['app/AGPL-3.0/LICENSE', 'components/qtbase-6.12.0-required/LICENSES/LGPL-3.0-only.txt', 'components/qtbase-6.12.0-required/LICENSES/Apache-2.0.txt', 'components/qtbase-6.12.0-required/LICENSES/MIT.txt', 'components/mupdf-1.27.2-native/COPYING']:
                  assert prefix in names, prefix
              print('Verified license/notice files:',len(names))
          PY
      - name: Stage immutable source and notice assets
        run: |
          mkdir -p release-assets
          cp dist/source-candidates/*.tar.gz dist/source-candidates/*.tar.xz release-assets/
          cp dist/release-notices-review.zip release-assets/THIRD_PARTY_NOTICES_2_7.zip
          cp dist/source-archive-audit.json release-assets/source-archive-audit.json
          cp dist/source-candidates/source-download-report.json release-assets/source-download-report.json
          cp docs/LGPL_RELINKING_2_7.md release-assets/LGPL_RELINKING_2_7.md
          cp docs/third_party_libffi_license.txt release-assets/libffi-LICENSE.txt
          cp docs/THIRD_PARTY_NOTICES_RELEASE_2_7.md release-assets/THIRD_PARTY_NOTICES_2_7.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-2-7-verified-sources
          path: release-assets/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows-onefile:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Freeze installed binary dependencies
        run: python -m pip install "PyMuPDF==1.27.2.3" "PySide6==6.12.0" "Pillow==12.3.0" "pyinstaller==6.22.3"
      - name: Build exact Windows onefile
        run: python -m PyInstaller --clean --noconfirm release_windows_review.spec
      - name: Rename reviewed binary to public release name
        shell: pwsh
        run: Move-Item dist/PDF_Compressor_2_7_license_review.exe dist/PDF_Compressor_2_7.exe
      - name: Capture final manifest, inventory and native-source mapping
        shell: pwsh
        run: |
          python tools/release_manifest.py --exe dist/PDF_Compressor_2_7.exe --out dist/build-manifest.json
          python tools/audit_pyinstaller_bundle.py --exe dist/PDF_Compressor_2_7.exe --reject-virtual-keyboard --out dist/bundle-audit.json
          python tools/audit_onefile_native_sources.py --audit dist/bundle-audit.json --out dist/native-source-mapping.json
          python tools/collect_license_evidence.py --exe dist/PDF_Compressor_2_7.exe --manifest dist/build-manifest.json --out dist/license-evidence.zip
      - name: Verify final EXE SHA, exact commit and forbidden Qt modules
        shell: pwsh
        env:
          EXPECTED_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          @'
          import hashlib,json,os
          from pathlib import Path
          exe=Path('dist/PDF_Compressor_2_7.exe')
          m=json.loads(Path('dist/build-manifest.json').read_text())
          a=json.loads(Path('dist/bundle-audit.json').read_text())
          natives=json.loads(Path('dist/native-source-mapping.json').read_text())
          assert m['source_git_commit']==os.environ['EXPECTED_SOURCE_COMMIT'],(m['source_git_commit'],os.environ['EXPECTED_SOURCE_COMMIT'])
          assert m['source_has_local_changes'] is False
          assert m['exe_size_bytes']==exe.stat().st_size
          assert hashlib.sha256(exe.read_bytes()).hexdigest()==m['exe_sha256']==a['sha256']
          assert m['builder_os']=='Windows'
          assert m['builder_python'].startswith('3.14.')
          assert all(m['installed_builder_package_versions'][name]==version for name,version in [('PySide6','6.12.0'),('Pillow','12.3.0'),('PyMuPDF','1.27.2.3'),('pyinstaller','6.22.3')])
          names=[x['name'].replace(chr(92),'/').lower() for x in a['all_entries']]
          assert not a['included_virtual_keyboard_files']
          blocked=('qt6pdf.dll','qpdf.dll','qt6qml.dll','qt6quick.dll')
          assert not [n for n in names if any(n.endswith('/'+e) for e in blocked)]
          assert natives['native_file_count']>100
          assert not natives['unmapped_native_files'] and not natives['missing_required_source_entries']
          print('Final EXE integrity OK:',m['exe_name'],m['exe_size_bytes'],m['exe_sha256'])
          '@ | python -
      - name: Clean-runner Windows GUI smoke (no installed project needed)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $exe = (Resolve-Path 'dist/PDF_Compressor_2_7.exe').Path
          $p = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 12
            $p.Refresh()
            if ($p.HasExited) { throw "Final EXE exited early: $($p.ExitCode)" }
          } finally {
            $p.Refresh()
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }
      - name: Prepare Windows release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory release-assets -Force | Out-Null
          Copy-Item dist/PDF_Compressor_2_7.exe release-assets/
          Copy-Item dist/build-manifest.json release-assets/
          Copy-Item dist/bundle-audit.json release-assets/
          Copy-Item dist/native-source-mapping.json release-assets/
          Copy-Item dist/license-evidence.zip release-assets/
      - uses: actions/upload-artifact@v4
        with:
          name: release-2-7-verified-windows-onefile
          path: release-assets/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    # Publishing happens only on push to stable main, never on a PR or workflow_dispatch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [windows-tests, sources-and-notices, windows-onefile]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Refuse overwrite of existing release/tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.7.0 >/dev/null 2>&1; then
            echo 'Release v2.7.0 already exists; no overwrite.' >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v2.7.0 >/dev/null 2>&1; then
            echo 'Tag v2.7.0 already exists; refuse overwrite.' >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: release-2-7-verified-sources
          path: release-assets/
      - uses: actions/download-artifact@v4
        with:
          name: release-2-7-verified-windows-onefile
          path: release-assets/
      - name: Confirm expected release asset set and generate checksums
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          base=pathlib.Path('release-assets')
          cat=json.loads(pathlib.Path('docs/source-archives-2_7.json').read_text())
          required={x['filename'] for x in cat['entries'] if x['required']}
          need=required|{'PDF_Compressor_2_7.exe','THIRD_PARTY_NOTICES_2_7.zip','license-evidence.zip','LGPL_RELINKING_2_7.md','build-manifest.json','native-source-mapping.json','bundle-audit.json','source-archive-audit.json','source-download-report.json'}
          missing=need-{p.name for p in base.iterdir()}
          if missing: raise SystemExit(f'Missing release assets: {sorted(missing)}')
          m=json.loads((base/'build-manifest.json').read_text())
          if m['source_git_commit']!='${{ github.sha }}': raise SystemExit('Release binary built from unexpected commit')
          if hashlib.sha256((base/'PDF_Compressor_2_7.exe').read_bytes()).hexdigest()!=m['exe_sha256']: raise SystemExit('EXE hash mismatch')
          lines=[]
          for p in sorted(base.iterdir()):
              if p.is_file():
                  lines.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}")
          (base/'SHA256SUMS.txt').write_text('\n'.join(lines)+'\n')
          print('Prepared release assets:',len(lines))
          PY
      - name: Publish v2.7.0 and upload exact binary, complete six sources and notices
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.7.0 release-assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'PDF Compressor 2.7.0' --notes-file docs/RELEASE_NOTES_2_7.md --draft
      - name: Verify release assets while still unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.7.0 --json isDraft,isPrerelease,assets,tagName,url | python -c "import json,sys; d=json.load(sys.stdin); names={a['name'] for a in d['assets']}; assert d['isDraft'] and not d['isPrerelease']; assert 'PDF_Compressor_2_7.exe' in names and 'SHA256SUMS.txt' in names and 'THIRD_PARTY_NOTICES_2_7.zip' in names and len(names)>=15,d; print(d['url'], len(names),'draft assets verified')"
      - name: Publish fully verified draft and mark latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v2.7.0 --draft=false --latest
      - name: Confirm public release is visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.7.0 --json isDraft,isPrerelease,url | python -c "import json,sys; d=json.load(sys.stdin); assert not d['isDraft'] and not d['isPrerelease']; print('Published', d['url'])"
