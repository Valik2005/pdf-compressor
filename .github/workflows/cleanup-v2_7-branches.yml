name: One-time cleanup of merged 2.7 development branches

# Remove only the eight explicit 2.7 branches after verifying that they
# have no commits absent from main and no open pull requests.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-v2_7-branches.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  remove-merged-branches:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify candidates and remove obsolete merged branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branches=(
            "develop/2.7-smartfit"
            "docs/2.7-release-readiness"
            "fix/2.7-control-audit"
            "fix/2.7-dpi-preservation"
            "fix/2.7-pdf-tool-output-cleanup"
            "fix/2.7-responsive-file-list"
            "perf/2.7-smartfit-strict-target-search"
            "release/2.7-bundle-audit"
          )

          open_pr_heads="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '.[].head.ref')"
          echo "Preflight: refuse deletion if any branch contains unmerged commits or an open PR."
          for branch in "${branches[@]}"; do
            if [[ "$branch" == main || "$branch" != *2.7* ]]; then
              echo "Unexpected candidate: $branch" >&2
              exit 1
            fi
            if printf '%s\n' "$open_pr_heads" | grep -Fqx -- "$branch"; then
              echo "Open pull request uses $branch. Refusing deletion." >&2
              exit 1
            fi
            sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
            ahead="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$sha" --jq '.ahead_by')"
            echo "Checked $branch ($sha): ahead of main = $ahead"
            if [[ "$ahead" != "0" ]]; then
              echo "Unmerged commits on $branch. Refusing ALL branch deletions." >&2
              exit 1
            fi
          done

          for branch in "${branches[@]}"; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null
            echo "Deleted merged branch: $branch"
          done
          echo "Removed ${#branches[@]} obsolete 2.7 branches. Protected main and v2.7.0 tag were not touched."
