name: Windows EXE and Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. v2.6.0'
        required: true
        default: 'v2.6.0'
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build standalone EXE (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip

      - name: Install project and build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt "pyinstaller>=6.16,<8"

      - name: Run automated tests
        shell: pwsh
        run: python -m pytest -q

      - name: Build EXE (no console, no Python installation required)
        shell: pwsh
        run: >-
          python -m PyInstaller
          --noconfirm --clean --onefile --windowed
          --name PDF_Compressor_2_6
          --icon app_icon.ico
          --add-data "app_icon.ico;."
          --collect-all pymupdf
          --hidden-import PySide6.QtCore
          --hidden-import PySide6.QtGui
          --hidden-import PySide6.QtWidgets
          app.pyw

      - name: Verify Windows executable was generated
        shell: pwsh
        run: |
          $file = 'dist/PDF_Compressor_2_6.exe'
          if (-not (Test-Path $file)) { throw 'EXE missing' }
          $stream = [System.IO.File]::OpenRead((Resolve-Path $file))
          try {
            $signature = New-Object byte[] 2
            $count = $stream.Read($signature, 0, 2)
            if ($count -ne 2 -or $signature[0] -ne 77 -or $signature[1] -ne 90) {
              throw 'Built file does not have a Windows EXE header'
            }
          } finally { $stream.Close() }
          $size = [math]::Round((Get-Item $file).Length / 1MB, 2)
          Write-Host "Built $file ($size MiB)"

      - name: Upload downloadable EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF_Compressor_2_6-Windows-x64
          path: dist/PDF_Compressor_2_6.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # A manual run creates / updates a DRAFT Release with the EXE attached.
      # Publishing publicly is a separate user action after licensing review.
      - name: Create or update draft GitHub Release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          $tag = $env:RELEASE_TAG.Trim()
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:[-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid tag '$tag'. Example: v2.6.0"
          }
          $file = 'dist/PDF_Compressor_2_6.exe'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $file --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          } else {
            gh release create $tag $file --draft --title "PDF Compressor $tag - Windows" --notes-file RELEASE_NOTES.md --target "${{ github.sha }}"
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          Write-Host "EXE attached to release $tag (draft; review before publishing)."
